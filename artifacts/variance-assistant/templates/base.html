<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variance Assistant | Financial Review Desk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <aside class="app-sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <a href="/" aria-label="Variance Assistant home">
                        <span class="logo-mark" aria-hidden="true">VA</span>
                        <span>Variance<span class="logo-muted">Assistant</span></span>
                    </a>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-link {% if request and request.path == '/' %}nav-link-active{% elif not request %}nav-link-active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    New Analysis
                </a>
                <a href="/upload" class="nav-link {% if request and request.path and request.path.startswith('/upload') %}nav-link-active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    Upload Workbook
                </a>
                <a href="/admin" class="nav-link {% if request and request.path and request.path.startswith('/admin') %}nav-link-active{% endif %}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    History
                </a>
            </nav>
        </aside>
        
        <main class="app-main">
            <div class="container main-content">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                    <div class="banner banner-warning fade-in" role="status">
                        <span class="banner-label">Notice:</span>
                        <span class="banner-message">{{ message }}</span>
                    </div>
                    {% endfor %}
                {% endwith %}
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

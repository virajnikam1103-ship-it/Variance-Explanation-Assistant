<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variance Assistant | Financial Review Desk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="container header-content">
            <div class="logo">
                <a href="/" aria-label="Variance Assistant home">
                    <span class="logo-mark" aria-hidden="true">VA</span>
                    <span>Variance<span class="logo-muted">Assistant</span></span>
                </a>
            </div>
            <nav class="main-nav">
                <a href="/" class="nav-link nav-link-active">New Analysis</a>
                <a href="/admin" class="nav-link">History</a>
            </nav>
        </div>
    </header>
    
    <main class="container app-main">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="banner banner-warning fade-in" role="status">
                <span class="banner-label">Notice:</span>
                <span class="banner-message">{{ message }}</span>
            </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
